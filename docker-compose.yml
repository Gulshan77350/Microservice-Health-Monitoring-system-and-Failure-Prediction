# One image for all three simulated services (built once from services/Dockerfile),
# run as three containers that differ only by SERVICE_NAME / DOWNSTREAM_URL.
x-service: &service
  image: health-monitor/service:local
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

services:

  # ── Simulated microservices: payment -> order -> notification ────────────
  payment-service:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: payment-service
    environment:
      - SERVICE_NAME=payment
      - DOWNSTREAM_URL=http://order-service:8000
      - API_KEY=${API_KEY:-local-demo-key}
    ports:
      - "8001:8000"

  order-service:
    <<: *service
    pull_policy: never
    container_name: order-service
    environment:
      - SERVICE_NAME=order
      - DOWNSTREAM_URL=http://notification-service:8000
      - API_KEY=${API_KEY:-local-demo-key}
    ports:
      - "8002:8000"
    depends_on:
      payment-service:
        condition: service_started

  notification-service:
    <<: *service
    pull_policy: never
    container_name: notification-service
    environment:
      - SERVICE_NAME=notification
      - DOWNSTREAM_URL=
      - API_KEY=${API_KEY:-local-demo-key}
    ports:
      - "8003:8000"
    depends_on:
      payment-service:
        condition: service_started

  # ── Prediction API (calibrated XGBoost, artifacts/v3) ────────────────────
  prediction-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: prediction-api
    ports:
      - "8004:8004"
    environment:
      - API_KEY=${API_KEY:-local-demo-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - COLLECTOR_URL=http://collector:8005
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-}
      - DEFAULT_RECIPIENT=${DEFAULT_RECIPIENT:-}
    volumes:
      - api-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Telemetry Collector & Anomaly Detector ───────────────────────────────
  collector:
    build: ./collector
    container_name: collector
    ports:
      - "8005:8005"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8000/metrics
      - ORDER_SERVICE_URL=http://order-service:8000/metrics
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000/metrics
    restart: unless-stopped
    depends_on:
      payment-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Live React Dashboard ────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      prediction-api:
        condition: service_healthy
      collector:
        condition: service_healthy

volumes:
  api-data:
